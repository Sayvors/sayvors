# Staging deployment — EC2 t3.small (2 GB RAM, no swap).
# Backend only: caddy (TLS on 443) + api + redis + kafka.
# The Next.js web app deploys on Vercel; postgres is AWS RDS.
# Requires .env.prod next to this file (template: deploy/env.prod.example).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      - api
    # Caddy exposes its admin API on localhost:2019 inside the container.
    # Probing it proves the process is serving rather than merely running.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    # TODO: Pin to SHA256 digest instead of mutable :staging tag
    # e.g. ghcr.io/sayvors/sayvors-api@sha256:<digest>
    image: ghcr.io/sayvors/sayvors-api:staging
    restart: unless-stopped
    env_file:
      - ./.env.prod
    expose:
      - "8000"
    # Workers are speed-safe at any count: channel identity rests on the DB
    # unique index (user_id, platform, listing_key), so racers can never twin
    # rows. Set UVICORN_WORKERS in .env.prod (default 2). On a 4GB box use 3
    # and raise mem_limit below to ~1536m; on 2GB keep 2.
    # Trust Caddy's X-Forwarded-Proto so the API knows it is behind https.
    # Without it uvicorn reports scheme=http (default forwarded-allow-ips is
    # 127.0.0.1; Caddy connects from a container IP), which breaks Secure
    # cookies/CSRF and any absolute redirect. Only Caddy can reach this port —
    # it is unpublished, so "*" is scoped to the compose network.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --workers ${UVICORN_WORKERS:-2}"
    # HTTP-only: the queue/poll side of the platform (WhatsApp AI replies,
    # reviews auto-reply, syncs, publishers, Kafka consumers, outbox) runs in
    # the `worker` service below, so dashboard traffic can never delay a
    # message reply.
    environment:
      RUN_BACKGROUND_WORKERS: "false"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 768m
    # /readyz probes DB/Redis/Kafka and returns 503 when any is unreachable,
    # which is the signal to stop routing traffic to this instance. urllib is
    # used because the image has no curl.
    #
    # Same `python -m app.healthcheck` probe the worker uses, NOT an HTTP GET
    # of /readyz: this container only publishes 8000 internally, so a GET would
    # arrive with Host: 127.0.0.1:8000, which TrustedHostMiddleware rejects with
    # 400 unless 127.0.0.1 is added to ALLOWED_HOSTS. That produced an unhealthy
    # api on every deploy and, because the worker waits on service_healthy, kept
    # the worker from starting at all. Probing dependencies directly also keeps
    # the two containers on one code path, which is what app/healthcheck.py is
    # for. Timeout matches the worker's: a cold pool is slower than a loopback
    # GET.
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    volumes:
      # Uploaded files (media photos for Google, databank docs) live here —
      # without this volume every redeploy would wipe them.
      - uploadsdata:/app/data/uploads

  worker:
    image: ghcr.io/sayvors/sayvors-api:staging
    restart: unless-stopped
    env_file:
      - ./.env.prod
    # Same image as the api, no HTTP port: runs `python -m app.workers`
    # (AI replies, reviews auto-reply, Localith sync, post publisher,
    # analytics consumer, performance sync, outbox drainer). I/O-bound LLM
    # + DB work; 384m fits the 2GB box alongside api@768m — raise to 512m+
    # when the box grows, or `--scale worker=N` to fan out replies.
    command: python -m app.workers
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api:
        # The worker talks to the same Postgres schema the api migrates, so
        # starting before `alembic upgrade head` finishes risks a crash loop.
        condition: service_healthy
    mem_limit: 384m
    # The worker serves no HTTP, so /readyz is unavailable here. Same probe,
    # invoked in-process, so worker and api agree on what "ready" means.
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: this instance holds OTPs, rate-limit windows, JWT
    # blacklist entries and session indexes. An LRU eviction would silently
    # void brute-force limits / revocation checks; capacity alarms are the
    # correct control instead.
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 640m


  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    mem_limit: 256m
    depends_on:
      - api


volumes:
  caddy_data:
  caddy_config:
  redisdata:
  kafkadata:
  uploadsdata:
  prometheus_data:
