# Staging deployment — EC2 t3.small (2 GB RAM, no swap).
# Backend only: caddy (TLS on 443) + api + redis + kafka.
# The Next.js web app deploys on Vercel; postgres is AWS RDS.
# Requires .env.prod next to this file (template: deploy/env.prod.example).

services:
  caddy:
    image: caddy:2-alpine
    container_name: sayvors-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      - api

  api:
    image: ghcr.io/sayvors/sayvors-api:staging
    container_name: sayvors-api
    restart: unless-stopped
    env_file:
      - ./.env.prod
    expose:
      - "8000"
    # Workers are speed-safe at any count: channel identity rests on the DB
    # unique index (user_id, platform, listing_key), so racers can never twin
    # rows. Set UVICORN_WORKERS in .env.prod (default 2). On a 4GB box use 3
    # and raise mem_limit below to ~1536m; on 2GB keep 2.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2}"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    container_name: sayvors-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m

  kafka:
    image: apache/kafka:3.8.0
    container_name: sayvors-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 640m

volumes:
  caddy_data:
  caddy_config:
  redisdata:
  kafkadata:
