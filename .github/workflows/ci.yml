name: CI

on:
  # The deploy-staging ci-gate waits for these check-runs on the pushed
  # commit, so one run per merge to staging is all it needs there.
  #
  # Pull requests are gated too: development is where the work lands, and a
  # branch nothing checks is a branch where the checks only run after the
  # code has already been merged.
  push:
    branches: [staging]
  pull_request:
    branches: [development, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        # pgvector image: the RAG search path needs the `vector` extension.
        # Plain postgres:15-alpine has no extension files, so the pgvector
        # integration test could not run here.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sayvors
        options: >-
          --health-cmd "pg_isready -U postgres -d sayvors"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/api/pyproject.toml

      - name: Install API dependencies
        run: |
          pip install --upgrade pip
          pip install -e "services/api/.[dev]"

      - name: Verify single alembic head
        working-directory: services/api
        run: |
          set -e
          HEADS=$(alembic heads | wc -l)
          if [ "$HEADS" -ne 1 ]; then
            echo "FATAL: alembic has $HEADS heads — the migration chain forked."
            alembic heads
            exit 1
          fi
          echo "single head: $(alembic heads)"

      - name: Run migration guard
        working-directory: services/api
        run: python migration_guard.py

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sayvors
          DATABASE_READER_URL: ""
          DB_POOL_SIZE: "5"
          DB_POOL_MAX_OVERFLOW: "5"
          DB_POOL_TIMEOUT_SECONDS: "30"
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BOOTSTRAP_SERVERS: localhost:29092
          ADMIN_PASSWORD_HASH: dummy
          ADMIN_SESSION_MINUTES: 30
          JWT_SECRET: test-secret-key-do-not-use-in-production
          TESTING: "true"
          AUTH_RATE_LIMIT_FAIL_CLOSED: "false"
          RUN_BACKGROUND_WORKERS: "false"
          # Platform app credentials the sign-in endpoint guards check.
          # Token verification itself is mocked in tests; values are dummies.
          META_APP_ID: "test-meta-app-id"
          META_APP_SECRET: "test-meta-app-secret"
          GOOGLE_CLIENT_ID: "test-google-client-id"
          GOOGLE_CLIENT_SECRET: "test-google-client-secret"
        run: |
          cd services/api
          python -m pytest tests/ -q

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Run ESLint (publish feature files only)
        working-directory: apps/web
        run: npx eslint components/dashboard/publish/ConfirmModal.tsx components/dashboard/publish/MediaSink.tsx components/dashboard/publish/PublishComposer.tsx components/dashboard/publish/types.ts lib/api-analytics.ts lib/i18n/en.ts lib/i18n/ar.ts app/invite/\[token\]/page.tsx components/analytics/PresenceSection.tsx

  check-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm ci

      # The admin console is a product surface too: it gets the same
      # type-check as the customer app, otherwise a broken admin page only
      # shows up when somebody opens it. (Lint is not gated for this app.)
      - name: Run TypeScript typecheck
        working-directory: apps/admin
        run: npx tsc --noEmit
