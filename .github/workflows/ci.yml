name: CI

on:
  push:
    branches: [development, staging]
  pull_request:
    branches: [development, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sayvors
        options: >-
          --health-cmd "pg_isready -U postgres -d sayvors"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/api/pyproject.toml

      - name: Install API dependencies
        run: |
          pip install --upgrade pip
          pip install -e "services/api/.[dev]"

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sayvors
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BOOTSTRAP_SERVERS: localhost:29092
          ADMIN_PASSWORD_HASH: dummy
          ADMIN_SESSION_MINUTES: 30
          JWT_SECRET: test-secret-key-do-not-use-in-production
          TESTING: "true"
        run: |
          cd services/api
          python -m pytest tests/ -q

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Run TypeScript typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Run ESLint (publish feature files only)
        working-directory: apps/web
        run: npx eslint components/dashboard/publish/ConfirmModal.tsx components/dashboard/publish/MediaSink.tsx components/dashboard/publish/PublishComposer.tsx components/dashboard/publish/types.ts lib/api-analytics.ts lib/i18n/en.ts lib/i18n/ar.ts app/invite/\[token\]/page.tsx components/analytics/PresenceSection.tsx
