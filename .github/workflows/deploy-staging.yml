name: Deploy staging

on:
  push:
    branches: [staging]

permissions:
  contents: read
  packages: write
  checks: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/sayvors/sayvors-api

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI to pass on this commit
        id: check-ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SHA=${{ github.sha }}
          echo "Waiting for CI (pytest + lint + tsc) to pass on $SHA..."
          for i in $(seq 1 60); do
            # Latest check run per name (so a re-run supersedes its old attempt);
            # both CI jobs must complete, and both must be green.
            STATUS=$(gh api \
              "repos/${{ github.repository }}/commits/${SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name=="test-backend" or .name=="lint-frontend")] | sort_by([.name, .id]) | group_by(.name) | map(last) | if length < 2 then "pending" elif any(.status=="completed" and .conclusion!="success") then "failure" elif any(.status != "completed") then "pending" elif any(.conclusion != "success") then "failure" else "success" end' \
              2>/dev/null || echo "error")
            echo "poll $i/60: CI status = $STATUS"
            if [ "$STATUS" = "success" ]; then
              echo "CI passed — proceeding with deploy."
              exit 0
            fi
            if [ "$STATUS" = "failure" ]; then
              echo "CI failed — aborting deploy."
              exit 1
            fi
            sleep 10
          done
          echo "CI did not complete in time — aborting deploy."
          exit 1

  secrets-scan:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Working-tree scan only (--no-git): catches newly committed secrets
      # without failing on historical audit-doc mentions of old findings.
      - name: Gitleaks secret scan
        run: |
          set -e
          tag=$(curl -sSL -o /dev/null -w '%{url_effective}' https://github.com/gitleaks/gitleaks/releases/latest | grep -o '[^/]*$')
          curl -sSL --fail "https://github.com/gitleaks/gitleaks/releases/download/${tag}/gitleaks_${tag#v}_linux_x64.tar.gz" | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --source . -v --redact --config .gitleaks.toml

  build:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys are manual since the repo went private (the EC2's anonymous
  # HTTPS git fetch broke): CI builds + pushes the :staging image above,
  # a human pulls it up on the EC2:
  #   cd ~/sayvors && docker compose -f docker-compose.prod.yml pull \
  #     && docker compose -f docker-compose.prod.yml up -d --remove-orphans
  # The api container runs `alembic upgrade head` on boot, so migrations
  # stay automatic. compose/Caddyfile changes still need a manual
  # `git pull` on the server (add a read-only deploy key when needed).
