name: Deploy staging

on:
  push:
    branches: [staging]

permissions:
  contents: read
  packages: write
  checks: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/sayvors/sayvors-api

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI to pass on this commit
        id: check-ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SHA=${{ github.sha }}
          echo "Waiting for CI (pytest + lint + tsc) to pass on $SHA..."
          for i in $(seq 1 60); do
            # Latest check run per name (so a re-run supersedes its old attempt);
            # both CI jobs must complete, and both must be green.
            STATUS=$(gh api \
              "repos/${{ github.repository }}/commits/${SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name=="test-backend" or .name=="lint-frontend")] | sort_by([.name, .id]) | group_by(.name) | map(last) | if length < 2 then "pending" elif any(.status=="completed" and .conclusion!="success") then "failure" elif any(.status != "completed") then "pending" elif any(.conclusion != "success") then "failure" else "success" end' \
              2>/dev/null || echo "error")
            echo "poll $i/60: CI status = $STATUS"
            if [ "$STATUS" = "success" ]; then
              echo "CI passed — proceeding with deploy."
              exit 0
            fi
            if [ "$STATUS" = "failure" ]; then
              echo "CI failed — aborting deploy."
              exit 1
            fi
            sleep 10
          done
          echo "CI did not complete in time — aborting deploy."
          exit 1

  secrets-scan:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Working-tree scan only (--no-git): catches newly committed secrets
      # without failing on historical audit-doc mentions of old findings.
      - name: Gitleaks secret scan
        run: |
          set -e
          tag=$(curl -sSL -o /dev/null -w '%{url_effective}' https://github.com/gitleaks/gitleaks/releases/latest | grep -o '[^/]*$')
          curl -sSL --fail "https://github.com/gitleaks/gitleaks/releases/download/${tag}/gitleaks_${tag#v}_linux_x64.tar.gz" | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --source . -v --redact --config .gitleaks.toml

  build:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:${{ github.sha }}
          # Links the package to this repository. Without the source label
          # GHCR treats the package as unowned, and the visibility change
          # below (and any repo-scoped permission) does not apply to it.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The repository being public does NOT make the container package public.
  # GHCR package visibility is a separate setting, and a package created
  # while the repo was private stays private. A private package returns
  # 401 UNAUTHORIZED on the anonymous token exchange, which surfaces on the
  # deploy host as:
  #     Head "https://ghcr.io/v2/sayvors/sayvors-api/manifests/staging": denied: denied
  #
  # Flipping it to public here means the deploy host can pull with no
  # credentials at all - no PAT to rotate, no secret to leak onto the box.
  # Safe because the image contains no secrets: all runtime config comes
  # from .env.prod via compose env_file.
  publish-public-package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Make the staging image package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_REF: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          # IMAGE_REF is ghcr.io/sayvors/sayvors-api. The API wants the
          # package name alone (sayvors-api); the owner comes from the URL.
          PKG="${IMAGE_REF#ghcr.io/}"
          PKG="${PKG##*/}"
          OWNER="${OWNER,,}"

          # Try both the user and org endpoints; only one exists.
          CODE=""
          for BASE in "https://api.github.com/users/${OWNER}/packages/container" \
                      "https://api.github.com/orgs/${OWNER}/packages/container"; do
            URL="${BASE}/${PKG}"
            echo "PATCH ${URL}"
            CODE=$(curl -sS -o /tmp/pkg.json -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${URL}" \
              -d '{"visibility":"public"}')
            echo "  -> HTTP ${CODE}"
            if [ "${CODE}" = "200" ]; then
              echo "package ${PKG} is now public"
              break
            fi
            cat /tmp/pkg.json || true
            echo
          done

          if [ "${CODE}" != "200" ]; then
            echo "::warning::Could not set package visibility to public (HTTP ${CODE})."
            echo "::warning::The deploy host needs a PAT with read:packages, or"
            echo "::warning://${BASE}/${PKG} must be changed to public by hand."
            # Not fatal: the image is pushed either way, and a deploy host
            # with credentials can still pull it.
            exit 0
          fi

      - name: Verify the image can be pulled anonymously
        env:
          IMAGE_REF: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          # The deploy host pulls with no credentials. If this exchange
          # fails, the deploy WILL fail with "denied: denied" - catch it
          # here instead of on the box.
          CODE=$(curl -sS -o /tmp/tok.json -w "%{http_code}" \
            "https://ghcr.io/token?scope=repository:${IMAGE_REF}:pull&service=ghcr.io")
          echo "anonymous token exchange: HTTP ${CODE}"
          cat /tmp/tok.json
          echo
          if [ "${CODE}" != "200" ]; then
            echo "::error::The image is NOT anonymously pullable. The deploy"
            echo "::error::host will fail with 'denied: denied' until the"
            echo "::error::package is public or the host has a read:packages PAT."
            exit 1
          fi
          echo "anonymous pull works"

  # Deploys are manual since the repo went private (the EC2's anonymous
  # HTTPS git fetch broke): CI builds + pushes the :staging image above,
  # a human pulls it up on the EC2:
  #   cd ~/sayvors && docker compose -f docker-compose.prod.yml pull \
  #     && docker compose -f docker-compose.prod.yml up -d --remove-orphans
  # The api container runs `alembic upgrade head` on boot, so migrations
  # stay automatic. compose/Caddyfile changes still need a manual
  # `git pull` on the server (add a read-only deploy key when needed).
