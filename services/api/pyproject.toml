[project]
name = "sayvors-api"
version = "0.1.0"
description = "Sayvors API service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.0",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "openai>=1.60",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "aiokafka>=0.10",
    "pgvector>=0.3",
    "pypdfium2>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "ollama>=0.4",
    "cryptography>=43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
