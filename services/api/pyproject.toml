[project]
name = "sayvors-api"
version = "0.1.0"
description = "Sayvors API service"
requires-python = ">=3.11"
dependencies = [
    # 0.145.0 (released 2026-10-18) dropped the body_limit kwarg used in
    # app/main.py; 0.144.0 is verified working. Revisit once upstream settles.
    "fastapi>=0.115,<0.145",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.0",
    "email-validator>=2.2",
    # Security floor for the DNS decoder pulled by email-validator.
    "dnspython>=2.9.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "openai>=1.60",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "aiokafka>=0.10",
    "pgvector>=0.3",
    "pypdfium2>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "ollama>=0.4",
    "cryptography>=43.0",
    # Security floor for the ASN.1 decoder used by pyasn1-modules.
    "pyasn1>=0.6.5",
    "aiomysql>=0.2",
    "google-cloud-storage>=2.0",
    # Security floor for the OpenTelemetry API pulled by Google clients.
    "opentelemetry-api>=1.45.2",
    "edge-tts>=6.1",
    "Pillow>=13.0.0",
    "boto3>=1.35",
    "phonenumbers>=9.0",
    "Babel>=2.15",
    # zoneinfo has no system database on Windows; IANA zones for Google
    # EVENT/OFFER wall-clock times need this data package there.
    "tzdata>=2024.1",
    "sentry-sdk>=2.0",
    # Stateful orchestration for the review -> ticket -> handoff pipeline
    # (app/modules/review_engine/graph.py). Kept deliberately small: the graph
    # wraps existing sync/async helpers rather than reimplementing them.
    "langgraph>=1.0",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    # Parallel test execution for the full suite (CI and local). Scoped runs
    # still use xdist; do not override with `-n 0`.
    "pytest-xdist>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The full suite is ~2k tests and dominated by per-test imports/fixtures.
# `loadscope` keeps a module on one worker, which avoids module-global and
# Redis cross-talk while still filling every available CPU. Always keep xdist
# enabled, including scoped single-file runs.
addopts = "-ra -n auto --dist loadscope"
