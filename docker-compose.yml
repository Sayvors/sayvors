services:
  redis:
    image: redis:7-alpine
    container_name: sayvors-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: sayvors-kafka
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # GlitchTip — open-source Sentry alternative for error tracking
  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: sayvors-glitchtip
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      # Use host.docker.internal to reach YOUR LOCAL postgres from Docker.
      # Password comes from LOCAL_POSTGRES_PASSWORD in .env, never inline.
      - DATABASE_URL=postgresql://postgres:${LOCAL_POSTGRES_PASSWORD}@host.docker.internal:5432/glitchtip
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY}
      - DOMAIN=glitchtip.localhost
      - ALLOWED_HOSTS=glitchtip.localhost,localhost,127.0.0.1,glitchtip.sayvors.com
      - GLITCHTIP_DSN=http://glitchtip:8000/1
      - EMAIL_URL=smtp://smtp.example.com:587  # optional, for alerts
      # Single-container local run: embed the queue consumer in the web
      # process. Without this, SERVER_ROLE stays "web" (run-web.sh), which
      # serves the UI but never drains the Valkey ingest queue -- events are
      # accepted with HTTP 200 and then silently never persisted.
      - GLITCHTIP_EMBED_WORKER=true
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redisdata:
  kafkadata:
